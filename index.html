<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Промокоды и Купоны</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --card-radius: 16px;
            --transition: 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 0 20px 40px;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--glass-bg);
        }

        svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo svg {
            stroke: var(--accent-green);
        }

        /* Glass Panel Base */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Main Card */
        .main-card {
            padding: 24px;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .main-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .image-placeholder {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px dashed var(--glass-border);
        }

        .image-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            opacity: 0.5;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 700;
            color: #fbbf24;
        }

        .rating svg {
            fill: #fbbf24;
            stroke: none;
            width: 20px;
            height: 20px;
        }

        .reviews {
            color: var(--text-muted);
            font-size: 14px;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .like-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .like-btn:hover svg {
            stroke: #ef4444;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none; /* Firefox */
        }
        
        .tabs::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .tab {
            padding: 12px 24px;
            border-radius: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .tab.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
        }

        .tab:not(.active):hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Promo Section */
        .promo-section h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .promo-card {
            display: flex;
            align-items: center;
            padding: 24px;
            gap: 30px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        
        .promo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-green);
        }

        .promo-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .promo-left {
            flex-shrink: 0;
        }

        .promo-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-green);
            line-height: 1.1;
        }

        .promo-right {
            flex-grow: 1;
        }

        .promo-desc {
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .green-btn {
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            width: auto;
        }

        .green-btn:hover {
            background: var(--accent-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .green-btn:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .promo-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .green-btn {
                width: 100%;
            }
            
            .card-stats {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .like-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navigation -->
        <nav>
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                PROMO
            </div>
            <div class="nav-icons">
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Card -->
        <div class="glass-panel main-card">
            <div class="image-placeholder">
                <svg viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
            <div class="card-stats">
                <div class="rating-group">
                    <div class="rating">
                        4.98
                        <svg viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    </div>
                    <div class="reviews">172 оценки</div>
                </div>
                <button class="like-btn">
                    <svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    Нравится
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active">Активные сегодня</button>
            <button class="tab">Промокод</button>
            <button class="tab">Скидки</button>
        </div>

        <!-- Promo Section -->
        <section class="promo-section">
            <h2>Актуальные купоны и промокоды</h2>
            
            <div class="glass-panel promo-card">
                <div class="promo-left">
                    <div class="promo-value">2500<br>тенге</div>
                </div>
                <div class="promo-right">
                    <div class="promo-desc">Актуальный промокод на скидку 2500 тенге и доставку</div>
                    <button class="green-btn" id="show-promo-btn">Показать промокод</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Hidden Audio element -->
    <audio id="promo-audio" src="music.mp3"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('show-promo-btn');
            const audio = document.getElementById('promo-audio');

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                // Play music silently without any visual changes
                if (audio) {
                    audio.play().catch(function(error) {
                        console.error('Audio playback failed:', error);
                    });
                }
            });
        });
    </script>
</body>
</html>
